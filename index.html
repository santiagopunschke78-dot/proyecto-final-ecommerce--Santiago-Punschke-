
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dillom Store</title>

    <link rel="stylesheet" href="estilos2.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<body>

    <nav>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#productos">Productos</a></li>
            <li><a href="#remeras">Remeras</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <main>

        <section class="productos" id="productos">

            <article class="producto">

                <button>
                    <i class="fas fa-shopping-cart"></i>

            </article>

            <article class="producto">
                <img src="https://acdn-us.mitiendanube.com/stores/003/378/771/products/whatsapp-image-2024-07-29-at-8-47-29-pm-14-0d0911d12612f3e83e17222983335921-1024-1024.webp" alt="Buzo Dillom">

                <p>Buzo urbano estampado con diseños del artista.</p>

                <span class="precio">$55.000</span>

                <button>
                    <i class="fas fa-shopping-cart"></i>

            </article>

            <article class="producto">
                <img src="https://acdn-us.mitiendanube.com/stores/001/339/064/products/dillom-post-mortem-1c-a0cdf95e6820acebfc17156087616202-640-0.png" alt="Remera Post Mortem Dillom">

                <h2>Remera Post Mortem</h2>

                <span class="precio">$20.000</span>

                <button>
                    <i class="fas fa-shopping-cart"></i>
                    Agregar al carrito
                </button>
